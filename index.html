<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Лунна гравитация и физика на топките</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        h2 { margin-bottom: 5px; font-size: 18px; }
        .info { margin-bottom: 15px; font-size: 14px; color: #aaa; }
        #field {
            width: 600px;
            height: 400px;
            background: linear-gradient(to bottom, #111, #333);
            position: relative;
            border: 4px solid #555;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        .ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.5);
        }
        #red-ball { background-color: #ff3b30; }
        #blue-ball { background-color: #007aff; }
    </style>
</head>
<body>

    <h2>Червена: A/D + W (скачане) | Синя: Стрелки + Стрелка нагоре</h2>
    <div class="info">Лунна гравитация и еластични сблъсъци!</div>

    <div id="field">
        <div id="red-ball" class="ball"></div>
        <div id="blue-ball" class="ball"></div>
    </div>

    <script>
        const redBall = document.getElementById('red-ball');
        const blueBall = document.getElementById('blue-ball');
        const field = document.getElementById('field');

        // Позиции
        let rx = 150, ry = 100;
        let bx = 410, by = 100;

        // Скорости (вектори за физика)
        let rvx = 0, rvy = 0;
        let bvx = 0, bvy = 0;

        const gravity = 0.2;     // Слаба лунна гравитация
        const bounce = 0.75;     // Коефициент на отскачане (еластичност)
        const friction = 0.98;   // Въздушно съпротивление
        const acceleration = 0.5;// Ускорение при натискане на клавиш

        const radius = 20;
        const diameter = 40;
        const fieldWidth = 600;
        const fieldHeight = 400;

        const keys = {};

        window.addEventListener('keydown', e => { 
            keys[e.code] = true; 
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD"].includes(e.code)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function loop() {
            // Прилагане на лунна гравитация
            rvy += gravity;
            bvy += gravity;

            // Управление на червената топка (A, D, W)
            if (keys['KeyA']) rvx -= acceleration;
            if (keys['KeyD']) rvx += acceleration;
            if (keys['KeyW']) rvy -= 0.6; // Импулс нагоре срещу гравитацията

            // Управление на синята топка (Стрелки)
            if (keys['ArrowLeft']) bvx -= acceleration;
            if (keys['ArrowRight']) bvx += acceleration;
            if (keys['ArrowUp']) bvy -= 0.6;

            // Прилагане на триене/съпротивление
            rvx *= friction;
            rvy *= friction;
            bvx *= friction;
            bvy *= friction;

            // Обновяване на позициите
            rx += rvx;
            ry += rvy;
            bx += bvx;
            by += bvy;

            // --- Сблъсъци с границите на полето ---
            // Червена топка стенни сблъсъци
            if (rx < 0) { rx = 0; rvx = -rvx * bounce; }
            if (rx > fieldWidth - diameter) { rx = fieldWidth - diameter; rvx = -rvx * bounce; }
            if (ry < 0) { ry = 0; rvy = -rvy * bounce; }
            if (ry > fieldHeight - diameter) { ry = fieldHeight - diameter; rvy = -rvy * bounce; rvx *= 0.9; } // земно триене

            // Синя топка стенни сблъсъци
            if (bx < 0) { bx = 0; bvx = -bvx * bounce; }
            if (bx > fieldWidth - diameter) { bx = fieldWidth - diameter; bvx = -bvx * bounce; }
            if (by < 0) { by = 0; bvy = -bvy * bounce; }
            if (by > fieldHeight - diameter) { by = fieldHeight - diameter; bvy = -bvy * bounce; bvx *= 0.9; }

            // --- Сблъсък между двете топки (Elastic Collision) ---
            const cx1 = rx + radius, cy1 = ry + radius;
            const cx2 = bx + radius, cy2 = by + radius;

            const dx = cx2 - cx1;
            const dy = cy2 - cy1;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < diameter) {
                // Има сблъсък - разпръскваме ги да не застъпват
                const overlap = diameter - distance;
                const nx = dx / distance;
                const ny = dy / distance;

                // Разделяне на позициите по нормалата
                rx -= nx * overlap * 0.5;
                ry -= ny * overlap * 0.5;
                bx += nx * overlap * 0.5;
                by += ny * overlap * 0.5;

                // Размяна/пресмятане на скоростите при еластичен удар
                const kx = rvx - bvx;
                const ky = rvy - bvy;
                const p = 2 * (nx * kx + ny * ky) / 2;

                rvx -= p * nx * bounce;
                rvy -= p * ny * bounce;
                bvx += p * nx * bounce;
                bvy += p * ny * bounce;
            }

            // Рендиране на екрана
            redBall.style.left = rx + 'px';
            redBall.style.top = ry + 'px';
            blueBall.style.left = bx + 'px';
            blueBall.style.top = by + 'px';

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
